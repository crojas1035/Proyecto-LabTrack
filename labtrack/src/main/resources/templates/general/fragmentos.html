<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">

    <head th:fragment="head">
        <title>LabTrack</title>
        <meta charset="UTF-8"/>
        <meta name="viewport"
              content="width=device-width, initial-scale=1"/>

        <link th:href="@{/webjars/bootstrap/5.3.8/css/bootstrap.min.css}"
              rel="stylesheet"/>

        <link th:href="@{/webjars/font-awesome/7.2.0/css/all.css}"
              rel="stylesheet"/>

        <script th:src="@{/webjars/bootstrap/5.3.8/js/bootstrap.bundle.min.js}">
        </script>
    </head>

    <body>

        <header th:fragment="header">

            <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
                <div class="container">

                    <a class="navbar-brand"
                       th:href="@{/laboratorio/listado}">
                        <i class="fa-solid fa-computer"></i>
                        <span>LabTrack</span>
                    </a>

                    <button class="navbar-toggler"
                            type="button"
                            data-bs-toggle="collapse"
                            data-bs-target="#menuPrincipal"
                            aria-controls="menuPrincipal"
                            aria-expanded="false"
                            aria-label="Mostrar menú">

                        <span class="navbar-toggler-icon"></span>
                    </button>

                    <div class="collapse navbar-collapse"
                         id="menuPrincipal">

                        <ul class="navbar-nav me-auto">

                            <li class="nav-item">
                                <a class="nav-link"
                                   th:href="@{/laboratorio/listado}">
                                    <i class="fa-solid fa-building"></i>
                                    <span>Laboratories</span>
                                </a>
                            </li>

                            <li class="nav-item">
                                <a class="nav-link"
                                   th:href="@{/equipo/listado}">
                                    <i class="fa-solid fa-desktop"></i>
                                    <span>Equipment</span>
                                </a>
                            </li>

                            <li class="nav-item">
                                <a class="nav-link"
                                   th:href="@{/solicitud/listado}">
                                    <i class="fa-solid fa-calendar-check"></i>
                                    <span>Requests</span>
                                </a>
                            </li>

                            <li class="nav-item">
                                <a class="nav-link"
                                   th:href="@{/categoria/listado}">
                                    <i class="fa-solid fa-tags"></i>
                                    <span>Categories</span>
                                </a>
                            </li>

                            <li class="nav-item">
                                <a class="nav-link"
                                   th:href="@{/prestamo/listado}">
                                    <i class="fa-solid fa-handshake"></i>
                                    <span>Loans</span>
                                </a>
                            </li>

                            <li class="nav-item">
                                <a class="nav-link"
                                   th:href="@{/reporte/listado}">
                                    <i class="fa-solid fa-triangle-exclamation"></i>
                                    <span>Reports</span>
                                </a>
                            </li>

                        </ul>

                        </ul>

                    </div>
                </div>
            </nav>

            <section class="bg-primary text-white py-3">
                <div class="container">
                    <h1 class="h3 mb-0">
                        <i class="fa-solid fa-gears"></i>
                        <span>LabTrack Administration</span>
                    </h1>
                </div>
            </section>

        </header>

        <section th:fragment="mensajes"
                 class="container mt-3">

            <div th:if="${todoOk}"
                 class="alert alert-success alert-dismissible fade show"
                 role="alert">

                <i class="fa-solid fa-circle-check"></i>
                <span th:text="${todoOk}"></span>

                <button type="button"
                        class="btn-close"
                        data-bs-dismiss="alert"
                        th:attr="aria-label=#{boton.cerrar}">
                </button>
            </div>

            <div th:if="${error}"
                 class="alert alert-danger alert-dismissible fade show"
                 role="alert">

                <i class="fa-solid fa-triangle-exclamation"></i>
                <span th:text="${error}"></span>

                <button type="button"
                        class="btn-close"
                        data-bs-dismiss="alert"
                        th:attr="aria-label=#{boton.cerrar}">
                </button>
            </div>

        </section>

        <footer th:fragment="footer"
                class="bg-dark text-white text-center py-3 mt-5">

            <p class="mb-0">
                <i class="fa-solid fa-computer"></i>
                <span>LabTrack - Laboratory Management</span>
            </p>

        </footer>

    </body>
</html>
