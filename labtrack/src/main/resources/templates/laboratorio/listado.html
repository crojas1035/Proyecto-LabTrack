<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">

    <head th:replace="~{general/fragmentos :: head}"></head>

    <body>
        <header th:replace="~{general/fragmentos :: header}"></header>

        <section th:replace="~{general/fragmentos :: mensajes}"></section>

        <main class="container mt-4">
            <div class="d-flex justify-content-between
                        align-items-center mb-3">
                <div>
                    <h2 th:text="#{laboratorio.listado}">
                        Listado de laboratorios
                    </h2>

                    <span class="badge text-bg-primary"
                          th:text="${totalLaboratorios + ' ' + #messages.msg('laboratorio.registros')}">
                        0 registros
                    </span>
                </div>

                <a class="btn btn-success"
                   th:href="@{/laboratorio/nuevo}">
                    <i class="fa-solid fa-plus"></i>
                    <span th:text="#{laboratorio.registrar}">
                        Registrar laboratorio
                    </span>
                </a>
            </div>

            <div class="alert alert-info"
                 th:if="${#lists.isEmpty(laboratorios)}"
                 th:text="#{laboratorio.vacio}">
                No existen laboratorios registrados.
            </div>

            <div class="table-responsive"
                 th:if="${!#lists.isEmpty(laboratorios)}">

                <table class="table table-striped
                              table-bordered align-middle">

                    <thead class="table-dark">
                        <tr>
                            <th th:text="#{laboratorio.codigo}">Código</th>
                            <th th:text="#{laboratorio.nombre}">Nombre</th>
                            <th th:text="#{laboratorio.ubicacion}">Ubicación</th>
                            <th th:text="#{laboratorio.estado}">Estado</th>
                            <th th:text="#{laboratorio.activo}">Activo</th>

                            <th class="text-center"
                                th:text="#{laboratorio.acciones}">
                                Acciones
                            </th>
                        </tr>
                    </thead>

                    <tbody>
                        <tr th:each="laboratorio : ${laboratorios}">
                            <td th:text="${laboratorio.codigo}"></td>
                            <td th:text="${laboratorio.nombre}"></td>
                            <td th:text="${laboratorio.ubicacion}"></td>

                            <td>
                                <span class="badge text-bg-secondary"
                                      th:text="${laboratorio.estado}">
                                </span>
                            </td>

                            <td>
                                <span th:if="${laboratorio.activo}"
                                      class="badge text-bg-success"
                                      th:text="#{respuesta.si}">
                                    Sí
                                </span>

                                <span th:unless="${laboratorio.activo}"
                                      class="badge text-bg-danger"
                                      th:text="#{respuesta.no}">
                                    No
                                </span>
                            </td>

                            <td class="text-center">
                                <a class="btn btn-warning btn-sm"
                                   th:href="@{/laboratorio/modificar/}
                                   + ${laboratorio.idLaboratorio}">

                                    <i class="fa-solid fa-pen"></i>

                                    <span th:text="#{boton.modificar}">
                                        Modificar
                                    </span>
                                </a>

                                <form th:if="${laboratorio.activo}"
                                      th:action="@{/laboratorio/eliminar}"
                                      method="post"
                                      class="d-inline"
                                      th:attr="onsubmit=|return confirm('#{laboratorio.confirmar}');|">

                                    <input type="hidden"
                                           name="idLaboratorio"
                                           th:value="${laboratorio.idLaboratorio}"/>

                                    <button type="submit"
                                            class="btn btn-danger btn-sm">

                                        <i class="fa-solid fa-ban"></i>

                                        <span th:text="#{boton.desactivar}">
                                            Desactivar
                                        </span>
                                    </button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>

        <footer th:replace="~{general/fragmentos :: footer}"></footer>
    </body>
</html>
