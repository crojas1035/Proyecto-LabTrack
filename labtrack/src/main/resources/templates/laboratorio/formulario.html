<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">

    <head th:replace="~{general/fragmentos :: head}"></head>

    <body>
        <header th:replace="~{general/fragmentos :: header}"></header>

        <main class="container mt-4">
            <div class="card shadow">
                <div class="card-header bg-dark text-white">
                    <h2 class="h4 mb-0"
                        th:text="${laboratorio.idLaboratorio == null}
                        ? 'Registrar laboratorio'
                        : 'Modificar laboratorio'">
                    </h2>
                </div>

                <div class="card-body">
                    <form th:action="@{/laboratorio/guardar}"
                          th:object="${laboratorio}"
                          method="post">

                        <input type="hidden"
                               th:field="*{idLaboratorio}"/>

                        <input type="hidden"
                               th:field="*{activo}"/>

                        <div class="mb-3">
                            <label class="form-label">Código</label>
                            <input type="text"
                                   class="form-control"
                                   th:field="*{codigo}"
                                   maxlength="20"
                                   required/>

                            <div class="text-danger"
                                 th:if="${#fields.hasErrors('codigo')}"
                                 th:errors="*{codigo}">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Nombre</label>
                            <input type="text"
                                   class="form-control"
                                   th:field="*{nombre}"
                                   maxlength="60"
                                   required/>

                            <div class="text-danger"
                                 th:if="${#fields.hasErrors('nombre')}"
                                 th:errors="*{nombre}">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Ubicación</label>
                            <input type="text"
                                   class="form-control"
                                   th:field="*{ubicacion}"
                                   maxlength="100"
                                   required/>

                            <div class="text-danger"
                                 th:if="${#fields.hasErrors('ubicacion')}"
                                 th:errors="*{ubicacion}">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Estado</label>
                            <select class="form-select"
                                    th:field="*{estado}"
                                    required>
                                <option value="Disponible">
                                    Disponible
                                </option>
                                <option value="Mantenimiento">
                                    Mantenimiento
                                </option>
                                <option value="Cerrado">
                                    Cerrado
                                </option>
                            </select>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit"
                                    class="btn btn-success">
                                <i class="fa-solid fa-floppy-disk"></i>
                                Guardar
                            </button>

                            <a class="btn btn-secondary"
                               th:href="@{/laboratorio/listado}">
                                Cancelar
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </main>

        <footer th:replace="~{general/fragmentos :: footer}"></footer>
    </body>
</html>
