<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{general/fragmentos :: head}"></head>
    <body>
        <header th:replace="~{general/fragmentos :: header}"></header>
        <main class="container mt-4">
            <h2>Failure Report Form</h2>
            <form th:action="@{/reporte/guardar}" th:object="${reporte}" method="post">
                <input type="hidden" th:field="*{idReporte}"/>
                
                <div class="mb-3">
                    <label>Equipment</label>
                    <select class="form-select" th:field="*{equipo.idEquipo}" required>
                        <option value="">Select Equipment</option>
                        <option th:each="equipo : ${equipos}" th:value="${equipo.idEquipo}" th:text="${equipo.nombre}"></option>
                    </select>
                </div>

                <div class="mb-3">
                    <label>User</label>
                    <select class="form-select" th:field="*{usuario.idUsuario}" required>
                        <option th:if="${#lists.isEmpty(usuarios)}" value="" disabled selected>No users found</option>
                        <option th:unless="${#lists.isEmpty(usuarios)}" value="">Select User</option>
                        <option th:each="u : ${usuarios}" th:value="${u.idUsuario}" th:text="${u.nombre}"></option>
                    </select>
                </div>

                <div class="mb-3">
                    <label>Description</label>
                    <textarea class="form-control" th:field="*{descripcionFalla}" required rows="4"></textarea>
                </div>

                <div class="mb-3">
                    <label>Report Date</label>
                    <input type="date" class="form-control" th:field="*{fechaReporte}"/>
                </div>

                <div class="mb-3">
                    <label>Status</label>
                    <select class="form-select" th:field="*{estado}" required>
                        <option value="Pendiente">Pending</option>
                        <option value="En revisión">In Review</option>
                        <option value="Resuelto">Resolved</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-primary">Save</button>
                <a class="btn btn-secondary" th:href="@{/reporte/listado}">Cancel</a>
            </form>
        </main>
    </body>
</html>
