<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{general/fragmentos :: head}"></head>
    <body>
        <header th:replace="~{general/fragmentos :: header}"></header>
        <section th:replace="~{general/fragmentos :: mensajes}"></section>
        <main class="container mt-4">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <div><h2>Failure Reports</h2></div>
                <a class="btn btn-success" th:href="@{/reporte/nuevo}">Report failure</a>
            </div>
            <div class="table-responsive">
                <table class="table table-striped table-bordered align-middle">
                    <thead class="table-dark">
                        <tr><th>ID</th><th>Equipment</th><th>User</th><th>Description</th><th>Date</th><th>Status</th><th>Actions</th></tr>
                    </thead>
                    <tbody>
                        <tr th:each="r : ${reportes}">
                            <td th:text="${r.idReporte}"></td>
                            <td th:text="${r.equipo.nombre}"></td>
                            <td th:text="${r.usuario.nombre}"></td>
                            <td th:text="${r.descripcionFalla}"></td>
                            <td th:text="${r.fechaReporte}"></td>
                            <td th:text="${r.estado}"></td>
                            <td class="text-center">
                                <a class="btn btn-warning btn-sm" th:href="@{/reporte/modificar/} + ${r.idReporte}">Edit</a>
                                <form th:action="@{/reporte/eliminar}" method="post" class="d-inline">
                                    <input type="hidden" name="idReporte" th:value="${r.idReporte}"/>
                                    <button type="submit" class="btn btn-danger btn-sm" onsubmit="return confirm('Delete this report?');">Delete</button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
        <footer th:replace="~{general/fragmentos :: footer}"></footer>
    </body>
</html>
