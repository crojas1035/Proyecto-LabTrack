<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{general/fragmentos :: head}"></head>
    <body>
        <header th:replace="~{general/fragmentos :: header}"></header>
        <section th:replace="~{general/fragmentos :: mensajes}"></section>
        <main class="container mt-4">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <div><h2>Préstamos de Equipos</h2></div>
                <a class="btn btn-success" th:href="@{/prestamo/nuevo}">Registrar préstamo</a>
            </div>
            <div class="table-responsive">
                <table class="table table-striped table-bordered align-middle">
                    <thead class="table-dark">
                        <tr><th>ID</th><th>Usuario</th><th>Fecha Préstamo</th><th>Fecha Esperada</th><th>Estado</th><th>Activo</th><th>Acciones</th></tr>
                    </thead>
                    <tbody>
                        <tr th:each="p : ${prestamos}">
                            <td th:text="${p.idPrestamo}"></td>
                            <td th:text="${p.usuario.nombre}"></td>
                            <td th:text="${p.fechaPrestamo}"></td>
                            <td th:text="${p.fechaDevolucionEsperada}"></td>
                            <td th:text="${p.estado}"></td>
                            <td th:text="${p.activo}"></td>
                            <td class="text-center">
                                <a class="btn btn-warning btn-sm" th:href="@{/prestamo/modificar/} + ${p.idPrestamo}">Modificar</a>
                                <form th:if="${p.activo}" th:action="@{/prestamo/eliminar}" method="post" class="d-inline">
                                    <input type="hidden" name="idPrestamo" th:value="${p.idPrestamo}"/>
                                    <button type="submit" class="btn btn-danger btn-sm">Desactivar</button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
        <footer th:replace="~{general/fragmentos :: footer}"></footer>
    </body>
</html>
