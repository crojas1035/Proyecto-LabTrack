<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">

    <head th:replace="~{general/fragmentos :: head}"></head>

    <body>
        <header th:replace="~{general/fragmentos :: header}"></header>

        <section th:replace="~{general/fragmentos :: mensajes}"></section>

        <main class="container mt-4">
            <div class="card shadow">
                <div class="card-header bg-dark text-white">
                    <h2 class="h4 mb-0"
                        th:text="${equipo.idEquipo == null}
                        ? 'Register equipment'
                        : 'Edit equipment'">
                    </h2>
                </div>

                <div class="card-body">
                    <form th:action="@{/equipo/guardar}"
                          th:object="${equipo}"
                          method="post">

                        <input type="hidden"
                               th:field="*{idEquipo}"/>

                        <input type="hidden"
                               th:field="*{activo}"/>

                        <div class="mb-3">
                            <label class="form-label">Code</label>

                            <input type="text"
                                   class="form-control"
                                   th:field="*{codigo}"
                                   maxlength="20"
                                   required/>

                            <div class="text-danger"
                                 th:if="${#fields.hasErrors('codigo')}"
                                 th:errors="*{codigo}">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Name</label>

                            <input type="text"
                                   class="form-control"
                                   th:field="*{nombre}"
                                   maxlength="60"
                                   required/>

                            <div class="text-danger"
                                 th:if="${#fields.hasErrors('nombre')}"
                                 th:errors="*{nombre}">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Description</label>

                            <textarea class="form-control"
                                      th:field="*{descripcion}"
                                      rows="3">
                            </textarea>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Laboratory</label>

                            <select class="form-select"
                                    th:field="*{laboratorio.idLaboratorio}"
                                    required>

                                <option value="">
                                    Select a laboratory
                                </option>

                                <option th:each="laboratorio : ${laboratorios}"
                                        th:value="${laboratorio.idLaboratorio}"
                                        th:text="${laboratorio.nombre}">
                                </option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Category</label>

                            <select class="form-select"
                                    th:field="*{categoria.idCategoria}"
                                    required>

                                <option value="">
                                    Select a category
                                </option>

                                <option th:each="cat : ${categorias}"
                                        th:value="${cat.idCategoria}"
                                        th:text="${cat.nombre}">
                                </option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Status</label>

                            <select class="form-select"
                                    th:field="*{estado}"
                                    required>

                                <option value="Available">
                                    Available
                                </option>

                                <option value="In use">
                                    In use
                                </option>

                                <option value="Maintenance">
                                    Maintenance
                                </option>

                                <option value="Out of service">
                                    Out of service
                                </option>
                            </select>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit"
                                    class="btn btn-success">
                                <i class="fa-solid fa-floppy-disk"></i>
                                Save
                            </button>

                            <a class="btn btn-secondary"
                               th:href="@{/equipo/listado}">
                                Cancel
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </main>

        <footer th:replace="~{general/fragmentos :: footer}"></footer>
    </body>
</html>
