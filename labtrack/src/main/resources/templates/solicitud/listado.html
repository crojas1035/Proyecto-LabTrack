<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">

    <head th:replace="~{general/fragmentos :: head}">
        <title>LabTrack</title>
    </head>

    <body>
        <header th:replace="~{general/fragmentos :: header}"></header>

        <section th:replace="~{general/fragmentos :: mensajes}"></section>

        <main class="container mt-4">
            <div class="d-flex justify-content-between
                        align-items-center mb-3">

                <div>
                    <h2 th:text="#{solicitud.listado}">
                        Solicitudes de uso
                    </h2>

                    <span class="badge text-bg-primary"
                          th:text="${totalSolicitudes + ' '
                          + #messages.msg('solicitud.registros')}">
                        0 registros
                    </span>
                </div>

                <a class="btn btn-success"
                   th:href="@{/solicitud/nueva}">
                    <i class="fa-solid fa-plus"></i>

                    <span th:text="#{solicitud.nueva}">
                        Nueva solicitud
                    </span>
                </a>
            </div>

            <div class="alert alert-info"
                 th:if="${#lists.isEmpty(solicitudes)}"
                 th:text="#{solicitud.vacio}">
                No existen solicitudes registradas.
            </div>

            <div class="table-responsive"
                 th:if="${!#lists.isEmpty(solicitudes)}">

                <table class="table table-striped
                              table-bordered align-middle">

                    <thead class="table-dark">
                        <tr>
                            <th th:text="#{solicitud.usuario}">
                                Usuario
                            </th>

                            <th th:text="#{solicitud.laboratorio}">
                                Laboratorio
                            </th>

                            <th th:text="#{solicitud.fecha}">
                                Fecha de uso
                            </th>

                            <th th:text="#{solicitud.motivo}">
                                Motivo
                            </th>

                            <th th:text="#{solicitud.estado}">
                                Estado
                            </th>

                            <th class="text-center"
                                th:text="#{solicitud.acciones}">
                                Acciones
                            </th>
                        </tr>
                    </thead>

                    <tbody>
                        <tr th:each="solicitud : ${solicitudes}">
                            <td th:text="${solicitud.usuario.nombre}"></td>

                            <td th:text="${solicitud.laboratorio.nombre}"></td>

                            <td th:text="${solicitud.fechaUso}"></td>

                            <td th:text="${solicitud.motivo}"></td>

                            <td>
                                <span class="badge text-bg-secondary"
                                      th:if="${solicitud.estado == 'Pendiente'}"
                                      th:text="#{estado.pendiente}">
                                    Pendiente
                                </span>

                                <span class="badge text-bg-success"
                                      th:if="${solicitud.estado == 'Aprobada'}"
                                      th:text="#{estado.aprobada}">
                                    Aprobada
                                </span>

                                <span class="badge text-bg-danger"
                                      th:if="${solicitud.estado == 'Rechazada'}"
                                      th:text="#{estado.rechazada}">
                                    Rechazada
                                </span>
                            </td>

                            <td class="text-center">
                                <div th:if="${solicitud.estado == 'Pendiente'}">

                                    <form th:action="@{/solicitud/estado}"
                                          method="post"
                                          class="d-inline">

                                        <input type="hidden"
                                               name="idSolicitud"
                                               th:value="${solicitud.idSolicitud}"/>

                                        <input type="hidden"
                                               name="estado"
                                               value="Aprobada"/>

                                        <button type="submit"
                                                class="btn btn-success btn-sm">
                                            <i class="fa-solid fa-check"></i>

                                            <span th:text="#{boton.aprobar}">
                                                Aprobar
                                            </span>
                                        </button>
                                    </form>

                                    <form th:action="@{/solicitud/estado}"
                                          method="post"
                                          class="d-inline">

                                        <input type="hidden"
                                               name="idSolicitud"
                                               th:value="${solicitud.idSolicitud}"/>

                                        <input type="hidden"
                                               name="estado"
                                               value="Rechazada"/>

                                        <button type="submit"
                                                class="btn btn-danger btn-sm">
                                            <i class="fa-solid fa-xmark"></i>

                                            <span th:text="#{boton.rechazar}">
                                                Rechazar
                                            </span>
                                        </button>
                                    </form>
                                </div>

                                <span th:unless="${solicitud.estado == 'Pendiente'}"
                                      class="text-muted"
                                      th:text="#{solicitud.procesada}">
                                    Procesada
                                </span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>

        <footer th:replace="~{general/fragmentos :: footer}"></footer>
    </body>
</html>
